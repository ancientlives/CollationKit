name: Feature or research proposal
description: Propose a new capability, algorithm, evaluation, or research direction.
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, please check docs/development/BACKLOG.md and Part II of
        docs/reference/ALGORITHM_SURVEY.md. Your idea may already be analysed there. Proposals involving
        machine learning should engage with the position in docs/RESEARCH_INTRO.md §4.1.
  - type: textarea
    id: problem
    attributes:
      label: Problem or question
      description: What limitation or open question does this address? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How would we know it worked?
      description: The evidence you would use, for example the conformance corpus, the Verne full novels, the case studies, or a user study.
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      options:
        - label: The approach keeps the engine pure and deterministic, and reports each witness's own words.
